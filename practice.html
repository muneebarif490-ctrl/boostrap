<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <style>
        .container{
            display: flex;
            padding: 20px;
            justify-content: center;
        }
        .box{
            width: 100px;
            height: 100px;
            text-align: center;
            font-size: 30px;
            margin: 40px;
        }
        .box-a{
            background-color: cadetblue;
        }
         .box-b{
            background-color: rgb(179, 187, 187);
        }
         .box-c{
            background-color: rgb(79, 16, 151);
        }
         .box-d{
            background-color: cadetblue;
        }
        
    </style>
</head>
<body>
    <div class="container" >
        <div class="box box-a">A</div>
        <div class="box box-b">B</div>
        <div class="box box-c">C</div>
        <div class="box box-d">D</div>
        
    </div>
</body>
</html>
